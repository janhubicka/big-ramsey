name: C0 Lean audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - c0-lean-audit-v4-20260909
  push:
    branches:
      - c0-lean-audit-v4-20260909
    paths:
      - '**/*.lean'
      - 'lakefile.toml'
      - 'lean-toolchain'
      - '.github/workflows/c0-lean-audit.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean via elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Kernel-check C0 audit
        run: lake build
